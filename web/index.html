<script>
/* 3.3: remember whether this is a brand-new player before anything writes a save */
try{window.OCS_FIRST_RUN=!localStorage.getItem('ocs.v1')&&!localStorage.getItem('ocs.eco.v1')}catch(e){window.OCS_FIRST_RUN=false}
/* 提早套用主題與動態偏好，避免啟動閃爍 */
(function(){try{var s=JSON.parse(localStorage.getItem('ocs.v1')||'{}');var t=s.theme||'system';
var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
var r=document.documentElement;r.dataset.theme=d?'dark':'light';
var m=s.motion||'system';r.dataset.motion=(m==='reduce'||(m==='system'&&matchMedia('(prefers-reduced-motion: reduce)').matches))?'reduce':'full';
document.querySelector('meta[name=theme-color]').content=d?'#202C38':'#F4F2EC'}catch(e){}})();
</script>

<body>
<div id="app">
  <main id="pages">
    <!-- 首頁 -->
    <section class="page on" id="p-home" aria-label="首頁">
      <div class="stage home" id="homeStage"></div>
      <div class="hud-top">
        <button class="hud-av" id="homeChip" aria-label="切換夥伴"><span class="hav" id="homeAv"></span></button>
        <div class="hud-cap" id="hudCap" aria-expanded="false">
          <div class="cap-main"><span class="lvc"><svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-11A4.6 4.6 0 0 1 12 6.9a4.6 4.6 0 0 1 8 2.6c0 6.1-8 11-8 11z" fill="currentColor"/></svg><b id="lvTxt">Lv.1</b></span><div class="bar"><i id="barFill"></i></div>
            <button class="res" data-r="coin" aria-label="星幣"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#F6C65B"/><circle cx="12" cy="12" r="6" fill="none" stroke="#E7A93C" stroke-width="1.6"/><path d="M12 8.8v6.4" stroke="#E7A93C" stroke-width="1.6" stroke-linecap="round"/></svg><b id="rCoin">0</b><span class="pl">+</span></button></div>
          <div class="cap-ext"><div class="ext-in">
            <small id="xpTxt"></small>
            <button class="res" data-r="gem" aria-label="星鑽"><svg viewBox="0 0 24 24"><path d="M12 3l7 6-7 12L5 9z" fill="#B99CF0"/><path d="M5 9h14M9.5 9 12 3l2.5 6L12 21z" fill="none" stroke="#fff" opacity=".65" stroke-width="1.2" stroke-linejoin="round"/></svg><b id="rGem">0</b></button>
            <button class="res" data-r="star" aria-label="連續登入"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z" fill="#8FCBEF" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg><b id="rStar">0</b></button>
          </div></div>
        </div>
      </div>
      <div class="hud-rail" id="hudRail">
        <button class="rail-btn" data-go="toggle" aria-label="更多功能" aria-expanded="false"><span data-ic="more"></span><i class="rdot" id="railDot"></i></button>
        <div class="rail-ext">
          <button class="rail-btn" data-go="quest" aria-label="每日任務" data-ic="quest"></button>
          <button class="rail-btn" data-go="bag" aria-label="背包" data-ic="bag"></button>
          <button class="rail-btn" data-go="camera" aria-label="相機" data-ic="camera"></button>
          <button class="rail-btn" data-go="studio" aria-label="佈置" data-ic="palette"></button>
        </div>
      </div>
      <div class="hud-qa" id="fab">
        <div class="qa-more">
          <button class="qa-pill" data-act="call"><span data-ic="locate"></span>呼喚</button>
          <button class="qa-pill" data-act="sleep"><span data-ic="moon"></span><span id="fabSleepLbl">睡覺</span></button>
          <button class="qa-pill" data-act="hop"><span data-ic="up"></span>跳躍</button>
        </div>
        <div class="qa-row">
          <button class="qa-main" id="qaToggle" aria-label="陪伴一下（拖曳可移動）" aria-expanded="false" data-ic="hand"></button>
        </div>
      </div>
      <button class="hud-quest" id="questCard"><span class="qc-ic" data-ic="scroll"></span><span class="qc-t"><b id="qcT">每日任務</b><small id="qcD"></small></span><span class="chev" data-ic="right"></span><i class="rdot" id="qcDot"></i></button>
      <div class="qbag" id="qbag"></div>
    </section>
    <!-- 角色 -->
    <section class="page after" id="p-chars" aria-label="角色">
      <div class="scroll">
        <header class="phead"><div><h1>角色</h1><p id="charSub"></p></div>
          <div class="acts"><button class="icon-btn add" id="btnImport" aria-label="新增角色" data-ic="plus"></button></div></header>
        <div id="charSeg"></div>
        <div class="grid" id="charGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"></div>
      </div>
    </section>
    <!-- 工坊 -->
    <section class="page after" id="p-studio" aria-label="工坊">
      <div class="scroll">
        <header class="phead"><div><h1>工坊</h1><p>調整角色的外觀與擺放</p></div><span class="saved" id="saved"><span data-ic="check"></span>已儲存</span></header>
        <div class="swrow" id="stSwitch"></div>
        <div class="card wb">
          <div class="wb-stage"><div class="stage pv" id="stStage"></div><span class="wb-tag glass">預覽・可點擊、拖曳</span></div>
          <div class="wb-ctrl" id="stCtrl"></div>
        </div>
        <div class="sec">創作模組</div>
        <div class="group mods" id="stMods"></div>
        <div class="sec">匯入小提醒</div>
        <div class="card tip"><ul>
          <li><b>透明背景 PNG／WebP</b> 效果最好，系統會自動裁掉多餘的透明邊，讓腳底貼齊地面。</li>
          <li>素材會縮到最長邊 768px 保存，不會被拉伸或變形。</li>
          <li>GIF 目前僅使用第一格；逐格動畫與 Sprite Sheet 可在角色編輯器的「素材」分頁匯入。</li>
          <li>若角色面向左側，請在上方將「素材朝向」改為朝左，行走時方向才會正確。</li>
        </ul></div>
      </div>
    </section>
    <!-- 探索 -->
    <section class="page after" id="p-explore" aria-label="探索">
      <div class="scroll">
        <header class="phead"><div><h1>探索</h1><p>即將展開的世界</p></div>
          <div class="acts"><button class="icon-btn plain" id="exSettings" aria-label="設定" data-ic="sliders"></button></div></header>
        <div class="hero" id="exHero"></div>
        <div class="sec">夥伴生活</div>
        <div class="grid" id="exCats" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"></div>
        <div class="sec">裝置功能</div>
        <div class="group" id="exNative"></div>
      </div>
    </section>
  </main>

  <nav class="nav" id="nav" aria-label="主要導覽"><span class="nav-ind" id="navInd"></span>
    <button class="nav-btn on" data-tab="0" aria-label="首頁"><span data-ic="home"></span><i class="nd"></i></button>
    <button class="nav-btn" data-tab="1" aria-label="角色"><span data-ic="users"></span><i class="nd"></i></button>
    <button class="nav-btn" data-tab="2" aria-label="工坊"><span data-ic="palette"></span><i class="nd"></i></button>
    <button class="nav-btn" data-tab="3" aria-label="探索"><span data-ic="compass"></span><i class="nd"></i></button>
    <button class="nav-btn" data-nact="more" aria-label="更多"><span data-ic="more"></span></button>
  </nav>

  <div class="dghost" id="dghost"></div>
  <div id="splash"><b>OC SHIMEJI</b></div>
